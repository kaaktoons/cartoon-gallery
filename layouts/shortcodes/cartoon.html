{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "Cartoon Image" }}
{{ $caption := .Get "caption" | default "" }}

<div class="cartoon-card" style="margin-bottom: 20px; text-align: center;">
  <img 
    src="https://ik.imagekit.io/kaaktoons12/cartoons/{{ $src }}?tr=w-800,f-auto,q-80" 
    alt="{{ $alt }}" 
    loading="lazy" 
    style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"
  />
  {{ if $caption }}
    <p style="font-size: 0.9em; color: #555; margin-top: 6px;">{{ $caption }}</p>
  {{ end }}
</div>
