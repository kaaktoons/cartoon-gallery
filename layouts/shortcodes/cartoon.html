{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "Cartoon Image" }}
{{ $caption := .Get "caption" | default "" }}

<div class="cartoon-card" style="margin: 20px 0; text-align: center;">
  <img src="https://ik.imagekit.io/kaaktoons12/cartoons/{{ $src }}" alt="{{ $alt }}" style="max-width: 100%; height: auto; border-radius: 8px;" />
  {{ if $caption }}
    <p style="font-size: 0.9em; color: #555; margin-top: 6px;">{{ $caption }}</p>
  {{ end }}
</div>
